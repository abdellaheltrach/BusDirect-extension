<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusDirect - Seat Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-slate-50 font-['Roboto',sans-serif] min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-[#7eb1ff] px-6">
      <div class="max-w-7xl mx-auto flex flex-row justify-between items-center">
        <a href="/index.html">
          <img src="img/logo.png" alt="BusDirect Logo" class="w-36 object-contain" />
        </a>
        <ul class="flex flex-row justify-center items-center gap-4">
          <li class="ursor-pointer p-2 rounded-full hover:bg-[#0066FF]/20 transition-colors text-lg font-medium">
            <a href="/tikets.html">Tickets</a>
          </li>
          <li>
            <button class="cursor-pointer p-2 rounded-full hover:bg-[#0066FF]/20 transition-colors">
              <svg
                class="border-2 border-[#0C1E4A] rounded-full h-9 w-9 p-1 text-[#0C1E4A]"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                ting
                the
                global
                n
                stroke-linejoin="round"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 md:p-8 grow">
      <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-8 gap-6">
        <!-- stats -->
        <div
          class="bg-[#7eb1ff] p-4 border-2 border-[#DCDEE3] rounded-xl col-span-full flex flex-wrap justify-between items-center gap-4"
        >
          <div class="grid grid-cols-2 w-full lg:grid-cols-4 items-center gap-3">
            <!-- stat 1 total -->
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#000000] font-bold text-sm border-slate-100 pb-2.5">
                <p class="text-lg">800dh</p>
                <span class="text-[#e5e7eb] font-bold">Total earning this month</span>
              </div>
            </div>
            <!-- stat 2 total -->

            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>

            <!-- stat 3 total -->

            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>
            <!-- stat 2 total -->

            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>
          </div>
        </div>
        <!-- filters -->
        <div
          class="bg-[#7eb1ff] p-4 border-2 border-[#DCDEE3] rounded-xl col-span-full flex flex-wrap justify-between items-center gap-4"
        >
          <!-- city serch -->
          <div class="grid grid-cols-8 gap-3 items-center w-full">
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-row col-span-6">
              <label for="ville">ville:</label>
              <input type="text" id="ville" />
            </div>
            <!-- filter -->
            <div class="bg-white/40 min-w-[200px] p-4 rounded-xl border border-slate-100 flex flex-row col-span-2">
              <label for="filter">filter:</label>
              <select name="" id="filter">
                <option value="disponible">disponible</option>
                <option value="complete">complete</option>
              </select>
            </div>
          </div>
        </div>

        <!-- traject cards -->
        <div
          class="bg-[#7eb1ff] p-4 border-2 border-[#DCDEE3] rounded-xl col-span-full flex flex-wrap justify-between items-center gap-4"
        >
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 w-full">
            <!-- traject 1 -->
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>

            <!-- traject 1 end -->

            <!-- traject 2 -->
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>
            <!-- traject 2 end -->

            <!-- traject 3 -->
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>
            <!-- traject 3 end -->

            <!-- traject 4 -->
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>
            <!-- traject 4 end -->

            <!-- traject 5 -->
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>
            <!-- traject 5 end -->

            <!-- traject 6 -->
            <div class="bg-white/40 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
              <div class="flex items-center flex-col gap-2 text-[#0C1E4A] font-bold text-sm border-slate-100 pb-2.5">
                <p>Total Recette:</p>
                <span>800dh</span>
              </div>
            </div>
            <!-- traject 6 end -->
          </div>
        </div>

        <div
          class="bg-[#7eb1ff] p-4 border-2 border-[#DCDEE3] rounded-xl col-span-full flex flex-wrap justify-between items-center gap-4"
        >
          <div class="flex flex-row justify-center items-center gap-3 w-full">

              <button class="hidden rounded-[12px] px-4 py-2 bg-[#E7E5E4] ]">
                &lt;
              </button>

              <button class="rounded-[12px] px-4 py-2 bg-[#C2410C] text-white">
                1
              </button>

              <button class=" hover:cursor-pointer rounded-[12px] px-4 py-2 bg-[#E7E5E4] text-black">
                2
              </button>

              <button class="font-poppins hover:cursor-pointer rounded-[12px] px-4 py-2 bg-[#E7E5E4] text-black">
                3
              </button>
              <button class="font-poppins hover:cursor-pointer rounded-[12px] px-4 py-2 bg-[#E7E5E4] text-black">
                &gt;
              </button>
            
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#3f5362] px-8 py-6 mt-8">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
        <img src="img/logo.png" alt="BusDirect Logo" class="w-28 object-contain" />
        <p class="text-sm text-white/80 italic">Plus qu'un trajet, une expérience!</p>
      </div>
    </footer>

    <script src="/js/script.js"></script>
  </body>
</html>
